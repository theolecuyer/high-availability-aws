server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve "backend" through Docker's DNS at request time so nginx starts
    # even if the backend container isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3001;

    # No trailing slash/URI on proxy_pass: the original /api/... path is forwarded unchanged
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Behind the ALB, keep the original scheme (https) instead of nginx's own (http)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build assets can be cached forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths get index.html so client-side routing works
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
